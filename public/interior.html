<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Inside The Tulip Touch Café</title>
  <meta name="description" content="Step inside The Tulip Touch Café. Monochromatic Black & White luxury collection booth and dining lounge." />

  <!-- Preconnect & Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Caveat:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,600&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap"
    rel="stylesheet" />

  <!-- Instant Navigation Guard -->
  <script>
    (function() {
      var isBack = false;
      try {
        var navEntries = performance.getEntriesByType('navigation');
        if (navEntries && navEntries.length > 0 && navEntries[0].type === 'back_forward') {
          isBack = true;
        }
      } catch(e) {}
      if (isBack) {
        document.documentElement.classList.add('tulip-loaded');
      }
    })();
  </script>

  <link rel="stylesheet" href="style.css?v=41.0_interactive_frames" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden !important;
      margin: 0;
      padding: 0;
      background: #0d0d0d;
      user-select: none;
    }

    /* Fully fitted responsive viewport */
    .interior-viewport {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000000;
    }

    /* Proportional scaling scene wrapper */
    .interior-scene-wrap {
      position: relative;
      width: 100vw;
      height: calc(100vw * (578 / 1024));
      min-height: 100vh;
      min-width: calc(100vh * (1024 / 578));
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.8s cubic-bezier(0.2, 0.9, 0.3, 1);
    }

    .interior-full-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      display: block;
      filter: none !important;
      -webkit-filter: none !important;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* ==========================================================================
       6 Ornate Baroque Wall Frame Buttons
       ========================================================================== */
    .wall-frame-btn {
      position: absolute;
      background: transparent;
      border: none;
      cursor: pointer;
      pointer-events: auto;
      z-index: 25;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: 6px;
      border-radius: 20px;
      outline: none;
      -webkit-tap-highlight-color: transparent;
      transition: all 0.3s cubic-bezier(0.2, 0.9, 0.3, 1);
    }

    .wall-frame-btn.frame-1 { left: 4.5%; top: 11%; width: 10.5%; height: 28%; }
    .wall-frame-btn.frame-2 { left: 17.5%; top: 11%; width: 10.5%; height: 28%; }
    .wall-frame-btn.frame-3 { left: 31.0%; top: 11%; width: 11.5%; height: 28%; }
    .wall-frame-btn.frame-4 { left: 58.0%; top: 11%; width: 11.5%; height: 28%; }
    .wall-frame-btn.frame-5 { left: 72.5%; top: 11%; width: 10.5%; height: 28%; }
    .wall-frame-btn.frame-6 { left: 85.5%; top: 11%; width: 10.5%; height: 28%; }

    /* Glowing Aura on Wall Frame Hover */
    .frame-glow-ring {
      position: absolute;
      inset: -10px;
      border-radius: 28px;
      background: radial-gradient(ellipse at center, rgba(255, 235, 170, 0.7) 0%, rgba(220, 180, 95, 0.35) 45%, rgba(212, 175, 55, 0) 75%);
      opacity: 0;
      filter: blur(12px);
      pointer-events: none;
      transform: scale(0.85);
      transition: opacity 0.35s ease, transform 0.35s cubic-bezier(0.2, 0.9, 0.3, 1);
    }

    .wall-frame-btn:hover .frame-glow-ring,
    .wall-frame-btn:focus .frame-glow-ring {
      opacity: 1;
      transform: scale(1.08);
      animation: framePulse 2s ease-in-out infinite alternate;
    }

    @keyframes framePulse {
      0% { opacity: 0.7; transform: scale(1.03); }
      100% { opacity: 1; transform: scale(1.12); }
    }

    /* Floating Tag Label on Frame Hover */
    .frame-tag {
      position: relative;
      z-index: 5;
      background: rgba(18, 16, 14, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid rgba(255, 225, 160, 0.65);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.55), 0 0 16px rgba(220, 180, 100, 0.35);
      opacity: 0;
      transform: translateY(8px) scale(0.9);
      pointer-events: none;
      transition: all 0.35s cubic-bezier(0.2, 0.9, 0.3, 1);
      white-space: nowrap;
    }

    .wall-frame-btn:hover .frame-tag,
    .wall-frame-btn:focus .frame-tag {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .wall-frame-btn:hover {
      filter: drop-shadow(0 0 16px rgba(255, 235, 175, 0.9));
    }

    /* ==========================================================================
       Seating Hotspots (Table & Chairs)
       ========================================================================== */
    .seating-hotspot {
      position: absolute;
      cursor: pointer;
      pointer-events: auto;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 30px;
      outline: none;
      -webkit-tap-highlight-color: transparent;
      transition: all 0.35s cubic-bezier(0.2, 0.9, 0.3, 1);
    }

    .seating-hotspot.left-seating {
      left: 27%;
      top: 58%;
      width: 17%;
      height: 40%;
    }

    .seating-hotspot.right-seating {
      left: 56.5%;
      top: 58%;
      width: 19%;
      height: 40%;
    }

    .seating-glow-aura {
      position: absolute;
      inset: -18px;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(255, 245, 215, 0.65) 0%, rgba(225, 185, 105, 0.35) 45%, rgba(212, 175, 55, 0) 75%);
      opacity: 0;
      filter: blur(14px);
      pointer-events: none;
      transform: scale(0.88);
      transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.2, 0.9, 0.3, 1);
    }

    .seating-highlight-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      filter: drop-shadow(0 0 20px rgba(255, 235, 180, 0.9));
    }

    .seating-highlight-svg svg {
      width: 100%;
      height: 100%;
    }

    .seating-hotspot:hover .seating-glow-aura,
    .seating-hotspot:focus .seating-glow-aura,
    .seating-hotspot.active .seating-glow-aura {
      opacity: 1;
      transform: scale(1.05);
      animation: seatGlowPulse 2.2s ease-in-out infinite alternate;
    }

    .seating-hotspot:hover .seating-highlight-svg,
    .seating-hotspot:focus .seating-highlight-svg,
    .seating-hotspot.active .seating-highlight-svg {
      opacity: 1;
    }

    @keyframes seatGlowPulse {
      0% { opacity: 0.75; transform: scale(1.02); }
      100% { opacity: 1; transform: scale(1.12); }
    }

    /* Always Visible Floating "Have a Seat" Pill Button */
    .btn-have-seat {
      position: absolute;
      top: 36%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 26px;
      background: #ffffff;
      color: #1a1614;
      font-family: 'Inter', -apple-system, sans-serif;
      font-size: 0.88rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border: 2px solid #2b5c8f;
      border-radius: 30px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4), 0 0 20px rgba(255, 255, 255, 0.6);
      cursor: pointer;
      opacity: 1 !important;
      pointer-events: auto !important;
      transition: all 0.3s cubic-bezier(0.2, 0.9, 0.3, 1);
      white-space: nowrap;
      z-index: 30;
      animation: seatFloatGlow 3s ease-in-out infinite alternate;
    }

    .btn-have-seat .seat-icon {
      color: #ffd700;
      font-size: 1.1rem;
      animation: starShine 2s infinite ease-in-out;
    }

    @keyframes starShine {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      50% { transform: scale(1.35); opacity: 1; }
    }

    @keyframes seatFloatGlow {
      0% {
        transform: translate(-50%, -50%) translateY(0px) scale(1);
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.35), 0 0 15px rgba(255, 255, 255, 0.5);
      }
      100% {
        transform: translate(-50%, -50%) translateY(-6px) scale(1.04);
        box-shadow: 0 14px 35px rgba(0, 0, 0, 0.5), 0 0 25px rgba(255, 225, 140, 0.8);
      }
    }

    .btn-have-seat:hover {
      background: #1a1614;
      color: #ffffff;
      border-color: #ffd700;
      transform: translate(-50%, -50%) translateY(-8px) scale(1.08);
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.6), 0 0 35px rgba(255, 215, 0, 0.85);
    }

    /* Sleek Return to Courtyard (Icon-Only Circular Button) */
    .interior-return-pill {
      position: fixed;
      top: 24px;
      left: 24px;
      z-index: 100;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(20, 20, 20, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #ffffff;
      text-decoration: none;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      transition: all 0.3s cubic-bezier(0.2, 0.9, 0.3, 1);
      cursor: pointer;
    }

    .interior-return-pill svg {
      transition: transform 0.25s ease;
    }

    .interior-return-pill:hover {
      background: rgba(255, 255, 255, 0.95);
      color: #111111;
      transform: translateY(-2px) scale(1.06);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.5);
    }

    .interior-return-pill:hover svg {
      transform: translateX(-2px);
    }

    /* Seated Notification Toast */
    .seated-toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(30px);
      z-index: 120;
      background: rgba(18, 16, 14, 0.95);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 225, 160, 0.5);
      border-radius: 40px;
      padding: 14px 28px;
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      font-size: 0.88rem;
      letter-spacing: 0.05em;
      display: flex;
      align-items: center;
      gap: 12px;
      opacity: 0;
      pointer-events: none;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      transition: all 0.45s cubic-bezier(0.2, 0.9, 0.3, 1);
    }

    .seated-toast.active {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;
    }

    /* ==========================================================================
       Artwork / Frame Inspector Modal
       ========================================================================== */
    .frame-modal {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }

    .frame-modal.active {
      opacity: 1;
      pointer-events: auto;
    }

    .frame-modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .frame-modal-card {
      position: relative;
      z-index: 10;
      width: min(480px, 90vw);
      background: rgba(24, 21, 19, 0.96);
      border: 1px solid rgba(255, 225, 160, 0.5);
      border-radius: 24px;
      padding: 36px 30px 28px;
      color: #ffffff;
      text-align: center;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 35px rgba(212, 175, 55, 0.25);
      transform: translateY(20px) scale(0.94);
      transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.3, 1);
    }

    .frame-modal.active .frame-modal-card {
      transform: translateY(0) scale(1);
    }

    .frame-modal-close {
      position: absolute;
      top: 16px;
      right: 18px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .frame-modal-close:hover {
      background: #ffffff;
      color: #111111;
    }

    .modal-badge {
      font-family: 'Inter', sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #ffd700;
      margin-bottom: 12px;
    }

    .modal-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.75rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 14px;
    }

    .modal-desc {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.15rem;
      color: #dfd5cb;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .btn-modal-dismiss {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 24px;
      background: linear-gradient(135deg, #d4af37 0%, #aa8420 100%);
      color: #1a1614;
      font-family: 'Inter', sans-serif;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 16px rgba(212, 175, 55, 0.4);
    }

    .btn-modal-dismiss:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(212, 175, 55, 0.6);
      filter: brightness(1.1);
    }
  </style>
</head>

<body>

  <!-- Page Transition & Loading Curtain -->
  <div class="tulip-door-loader active" id="doorLoader" aria-hidden="true">
    <div class="loader-white-curtain">
      <div class="loader-emblem-wrap">
        <div class="loader-emblem-glow" aria-hidden="true"></div>
        <!-- 1. Lightened outline emblem -->
        <img src="assest/hero3d/hero-emblem.png"
          onerror="this.onerror=null; this.src='public/assest/hero3d/hero-emblem.png';"
          alt="The Tulip Touch Logo Light"
          class="loader-emblem-light" />
        
        <!-- 2. Full color emblem filling from center to outside in a circle -->
        <img src="assest/hero3d/hero-emblem.png"
          onerror="this.onerror=null; this.src='public/assest/hero3d/hero-emblem.png';"
          alt="The Tulip Touch Logo Full Color"
          class="loader-emblem-fill" id="loaderEmblemFill" />
      </div>
    </div>
  </div>

  <!-- Fullscreen Fitted Interior View & Interactive Hotspots -->
  <main class="interior-viewport" id="interiorStage">
    <div class="interior-scene-wrap" id="sceneWrap">
      <img src="assest/interior-view.jpg?v=original_photo_5"
        onerror="this.onerror=null; this.src='public/assest/interior-view.jpg?v=original_photo_5';"
        alt="The Tulip Touch Café Luxury Collection Interior"
        class="interior-full-img" id="interiorImg" />

      <!-- 6 Ornate Baroque Wall Frame Buttons -->
      <!-- Frame 1 (Far Left) -->
      <button class="wall-frame-btn frame-1" data-frame-id="1" data-title="Baroque Cameo I" data-desc="Hand-etched Parisian antique cameo setting showcasing fine vintage craftsmanship." aria-label="Inspect Baroque Cameo I">
        <span class="frame-glow-ring"></span>
        <span class="frame-tag">✦ Cameo I</span>
      </button>

      <!-- Frame 2 (Left Mid) -->
      <button class="wall-frame-btn frame-2" data-frame-id="2" data-title="Imperial Crest II" data-desc="Ornate rococo flourishes framing artisanal silver filigree tableware." aria-label="Inspect Imperial Crest II">
        <span class="frame-glow-ring"></span>
        <span class="frame-tag">✦ Crest II</span>
      </button>

      <!-- Frame 3 (Left Near Booth) -->
      <button class="wall-frame-btn frame-3" data-frame-id="3" data-title="Dual Medallion III" data-desc="Twin baroque oval portraits capturing timeless elegance and café heritage." aria-label="Inspect Dual Medallion III">
        <span class="frame-glow-ring"></span>
        <span class="frame-tag">✦ Medallion III</span>
      </button>

      <!-- Frame 4 (Right Near Booth) -->
      <button class="wall-frame-btn frame-4" data-frame-id="4" data-title="Dual Medallion IV" data-desc="Symmetric twin cameos adorned with ceremonial tea and espresso motifs." aria-label="Inspect Dual Medallion IV">
        <span class="frame-glow-ring"></span>
        <span class="frame-tag">✦ Medallion IV</span>
      </button>

      <!-- Frame 5 (Right Mid) -->
      <button class="wall-frame-btn frame-5" data-frame-id="5" data-title="Imperial Crest V" data-desc="Intricate scrollwork framing our signature boutique collection." aria-label="Inspect Imperial Crest V">
        <span class="frame-glow-ring"></span>
        <span class="frame-tag">✦ Crest V</span>
      </button>

      <!-- Frame 6 (Far Right) -->
      <button class="wall-frame-btn frame-6" data-frame-id="6" data-title="Baroque Cameo VI" data-desc="Master artisan mirror frame reflecting the illuminated monoclinic salón." aria-label="Inspect Baroque Cameo VI">
        <span class="frame-glow-ring"></span>
        <span class="frame-tag">✦ Cameo VI</span>
      </button>

      <!-- Left Table & Chairs Seating Hotspot -->
      <div class="seating-hotspot left-seating" id="leftSeatingHotspot" tabindex="0" role="button" aria-label="Have a seat at Left Dining Table">
        <div class="seating-glow-aura"></div>
        <div class="seating-highlight-svg">
          <svg viewBox="0 0 180 230" fill="none" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="90" cy="115" rx="82" ry="108" fill="url(#leftGoldGlow)" />
            <defs>
              <radialGradient id="leftGoldGlow" cx="0.5" cy="0.5" r="0.5" fx="0.5" fy="0.5">
                <stop offset="0%" stop-color="rgba(255, 245, 215, 0.45)" />
                <stop offset="55%" stop-color="rgba(220, 180, 95, 0.28)" />
                <stop offset="100%" stop-color="rgba(212, 175, 55, 0)" />
              </radialGradient>
            </defs>
          </svg>
        </div>
        <button class="btn-have-seat" id="btnSeatLeft">
          <span class="seat-icon">✦</span>
          <span class="seat-text">Have a Seat</span>
        </button>
      </div>

      <!-- Right Table & Chairs Seating Hotspot -->
      <div class="seating-hotspot right-seating" id="rightSeatingHotspot" tabindex="0" role="button" aria-label="Have a seat at Right Dining Table">
        <div class="seating-glow-aura"></div>
        <div class="seating-highlight-svg">
          <svg viewBox="0 0 200 230" fill="none" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="100" cy="115" rx="92" ry="108" fill="url(#rightGoldGlow)" />
            <defs>
              <radialGradient id="rightGoldGlow" cx="0.5" cy="0.5" r="0.5" fx="0.5" fy="0.5">
                <stop offset="0%" stop-color="rgba(255, 245, 215, 0.45)" />
                <stop offset="55%" stop-color="rgba(220, 180, 95, 0.28)" />
                <stop offset="100%" stop-color="rgba(212, 175, 55, 0)" />
              </radialGradient>
            </defs>
          </svg>
        </div>
        <button class="btn-have-seat" id="btnSeatRight">
          <span class="seat-icon">✦</span>
          <span class="seat-text">Have a Seat</span>
        </button>
      </div>
    </div>

    <!-- Sleek Return to Exterior Icon Button -->
    <a href="index.html" class="interior-return-pill" id="returnPill" aria-label="Back to Courtyard">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
    </a>

    <!-- Seated Feedback Toast -->
    <div class="seated-toast" id="seatedToast">
      <span style="color: #ffd700;">✦</span>
      <span id="toastMsg">You have taken your seat. Welcome to The Tulip Touch Café!</span>
    </div>

    <!-- Frame Artwork Detail Modal -->
    <div class="frame-modal" id="frameModal" aria-hidden="true">
      <div class="frame-modal-backdrop" id="frameModalBackdrop"></div>
      <div class="frame-modal-card">
        <button class="frame-modal-close" id="frameModalClose" aria-label="Close modal">&times;</button>
        <div class="modal-badge">✦ Signature Wall Collection ✦</div>
        <h3 class="modal-title" id="modalTitle">Baroque Cameo I</h3>
        <p class="modal-desc" id="modalDesc">Hand-etched Parisian antique cameo setting showcasing fine vintage craftsmanship and 2D comic art aesthetics.</p>
        <div class="modal-footer-action">
          <button class="btn-modal-dismiss" id="btnModalDismiss">Close Preview</button>
        </div>
      </div>
    </div>
  </main>

  <script>
    function dismissInteriorLoader() {
      const loader = document.getElementById('doorLoader');
      if (!loader) return;
      loader.classList.remove('active', 'animating', 'pull-up', 'pull-up-enter');
      loader.classList.add('dismissed');
      loader.style.display = 'none';
    }

    window.addEventListener('DOMContentLoaded', () => {
      const loader = document.getElementById('doorLoader');
      const returnPill = document.getElementById('returnPill');
      const leftBtn = document.getElementById('btnSeatLeft');
      const rightBtn = document.getElementById('btnSeatRight');
      const toast = document.getElementById('seatedToast');
      const toastMsg = document.getElementById('toastMsg');

      // Modal elements
      const frameModal = document.getElementById('frameModal');
      const frameModalBackdrop = document.getElementById('frameModalBackdrop');
      const frameModalClose = document.getElementById('frameModalClose');
      const btnModalDismiss = document.getElementById('btnModalDismiss');
      const modalTitle = document.getElementById('modalTitle');
      const modalDesc = document.getElementById('modalDesc');

      const navEntry = window.performance && performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
      const isBackForward = navEntry && navEntry.type === 'back_forward';

      if (isBackForward) {
        dismissInteriorLoader();
      } else if (loader && !loader.classList.contains('dismissed')) {
        setTimeout(() => {
          loader.classList.add('animating');
        }, 100);

        setTimeout(() => {
          loader.classList.add('pull-up');
          setTimeout(() => {
            dismissInteriorLoader();
          }, 1000);
        }, 1200);
      }

      // "Have a Seat" Click Action
      function handleSeatClick(tableSide) {
        if (!toast || !toastMsg) return;
        toastMsg.textContent = `You have taken your seat at the ${tableSide} Table. Welcome to The Tulip Touch!`;
        toast.classList.add('active');
        setTimeout(() => {
          toast.classList.remove('active');
        }, 3600);
      }

      // "Have a Seat" Click Action -> Open Fully White Page with Curtain Loading Animation
      function handleSeatTransition(e) {
        if (e) {
          e.preventDefault();
          e.stopPropagation();
        }
        const targetUrl = 'seat.html';

        if (!loader) {
          window.location.href = targetUrl;
          return;
        }

        loader.style.display = 'flex';
        loader.classList.remove('dismissed', 'pull-up', 'pull-up-enter', 'animating', 'active');
        loader.classList.add('door-falling');

        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            loader.classList.add('active');
          });
        });

        setTimeout(() => {
          loader.classList.add('animating');
        }, 400);

        setTimeout(() => {
          window.location.href = targetUrl;
        }, 1800);
      }

      if (leftBtn) {
        leftBtn.addEventListener('click', handleSeatTransition);
      }

      if (rightBtn) {
        rightBtn.addEventListener('click', handleSeatTransition);
      }

      // Wall Frame Click -> Smooth White Curtain Drop Transition to New White Page
      const frameButtons = document.querySelectorAll('.wall-frame-btn');
      frameButtons.forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          const frameId = btn.getAttribute('data-frame-id') || '1';
          const targetUrl = 'collection.html?frame=' + frameId;

          if (!loader) {
            window.location.href = targetUrl;
            return;
          }

          // 1. Reset and start curtain falling from top to bottom
          loader.style.display = 'flex';
          loader.classList.remove('dismissed', 'pull-up', 'pull-up-enter', 'animating', 'active');
          loader.classList.add('door-falling');

          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              loader.classList.add('active');
            });
          });

          // 2. Start slow glowing breathing logo
          setTimeout(() => {
            loader.classList.add('animating');
          }, 400);

          // 3. Navigate to the new white collection page
          setTimeout(() => {
            window.location.href = targetUrl;
          }, 1800);
        });
      });

      // Return to courtyard transition
      if (returnPill && loader) {
        returnPill.addEventListener('click', (e) => {
          e.preventDefault();
          const target = returnPill.getAttribute('href') || 'index.html';

          loader.style.display = 'flex';
          loader.classList.remove('dismissed', 'pull-up', 'animating', 'active');
          loader.classList.add('door-falling');

          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              loader.classList.add('active');
            });
          });

          setTimeout(() => {
            window.location.href = target;
          }, 850);
        });
      }
    });

    // BFCache / History Navigation Handler
    window.addEventListener('pageshow', (event) => {
      const navEntry = window.performance && performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
      if (event.persisted || (navEntry && navEntry.type === 'back_forward')) {
        dismissInteriorLoader();
      }
    });

    window.addEventListener('popstate', () => {
      dismissInteriorLoader();
    });
  </script>
</body>

</html>
